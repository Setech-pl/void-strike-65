# M5b-S3 (docs/plans/m5-loading-boss.md §5.11, owner answer Q-S1): the boss
# overlay - one link, two homes, written one after the other into one image
# that scripts/build.mjs splits into the boss code run and the install run.
#
# BOSS_SLOT_RAM     overlay slot A, the capital group's 2,048 B in BROADSIDE;
#                   scripts/build.mjs substitutes main's capital_slot_a and
#                   the slot's size. 16 sectors, read at every boss entry.
#                   BSS lives here too: zero in the image, set by the install.
# BOSS_INSTALL_RAM  the staging RAM at $7810 (the pause backup), below the
#                   region's staging run at $7990: the shared 3-sector install
#                   run, run once in place (Q-S6).

MEMORY {
    BOSS_SLOT_RAM:    start = $6DE8, size = $0800, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
    BOSS_INSTALL_RAM: start = $7810, size = $0180, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
}

SEGMENTS {
    BOSS_HEAD:     load = BOSS_SLOT_RAM,    type = ro, define = yes;
    BOSS_CODE:     load = BOSS_SLOT_RAM,    type = ro, define = yes;
    BOSS_C_CODE:   load = BOSS_SLOT_RAM,    type = ro, define = yes;
    BOSS_C_RODATA: load = BOSS_SLOT_RAM,    type = ro, define = yes, optional = yes;
    BOSS_BSS:      load = BOSS_SLOT_RAM,    type = bss, define = yes;
    BOSS_C_BSS:    load = BOSS_SLOT_RAM,    type = bss, define = yes;
    BOSS_INSTALL:  load = BOSS_INSTALL_RAM, type = ro, define = yes;
}
