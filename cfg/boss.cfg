# M5b-S3 / S4a-i (docs/plans/m5-loading-boss.md §5.11, §5.13.4; owner answers
# Q-S1, Q-B5): the boss overlay - one link, three homes in one image, which
# scripts/build.mjs splits into the boss code run, the install run and the
# slot-C run; the scratch page is never written to the image.
#
# BOSS_SLOT_RAM     overlay slot A, the capital group's 2,048 B in BROADSIDE;
#                   scripts/build.mjs substitutes main's capital_slot_a and
#                   the slot's size. Read at every boss entry, sized to use.
# BOSS_INSTALL_RAM  the staging RAM at $7810 (the pause backup), below the
#                   region's theme run at $7990: the shared 3-sector install
#                   run, run once in place (Q-S6).
# BOSS_SLOT_C_RAM   slot C at $1000-$17FF, inside the boss's low-RAM claim
#                   $0C00-$18FF (Q-B5): the C controller and the overlay's
#                   once-per-entry ASM (BOSS_C_ASM: boss_prepare), read at
#                   every boss entry, sized to use. Its BSS follows the code and is never
#                   read: boss_c_init sets every byte it reads.
# BOSS_SCRATCH_RAM  $1800-$18FF, the claim's scratch page: the column map,
#                   S4a-ii's cell-flash ring, slot A's state. Set by the
#                   install; nothing survives a boss sector. Its last ten
#                   bytes (BOSS_HUD_BACKUP, S5-1) hold the HUD booster cells
#                   across the entry.
# BOSS_SLOT_D_RAM   $1900-$1FFF, the claim grown by owner decision Q7
#                   (M5b-S4b): the lasers and the boss shots inside the band,
#                   read at every boss entry after slot C, sized to use. Its
#                   BSS follows the code and is never read: the install sets
#                   every byte it reads. (M5b-S4b.4 put the region's look tail
#                   first here; S5-1 moved it to slot F, the region block.)
# BOSS_SLOT_E_RAM   $4C00-$4E3F, M5b-S4b.5 (owner decision of 2026-10-07):
#                   slot E, in the expanded hull maps (CAPITAL_HULL_RUNTIME_ALLIED
#                   / _ENEMY), which only the capital sector's draw_hull_row reads
#                   and every gameplay start rebuilds (start_gameplay ->
#                   publish_level_hull_style); read at the boss entry after slot
#                   D, live in the boss sector only. A declared overlap with
#                   those maps (scripts/memory-map-report.mjs).
# The region's charset at $0C00-$0FFF and its block in slot F ($5200-$53FF,
# the HUD charset's unused upper half, S5-1) are data, read by slot A's head.

MEMORY {
    BOSS_SLOT_RAM:    start = $6DE8, size = $0800, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
    BOSS_INSTALL_RAM: start = $7810, size = $0180, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
    BOSS_SLOT_C_RAM:  start = $1000, size = $0800, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
    BOSS_SCRATCH_RAM: start = $1800, size = $0100, type = rw, file = "", define = yes;
    BOSS_SLOT_D_RAM:  start = $1900, size = $0700, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
    BOSS_SLOT_E_RAM:  start = $4C00, size = $0240, type = rw, file = %O, fill = yes, fillval = $00, define = yes;
}

SEGMENTS {
    BOSS_HEAD:     load = BOSS_SLOT_RAM,    type = ro, define = yes;
    BOSS_CODE:     load = BOSS_SLOT_RAM,    type = ro, define = yes;
    # audit-hardening: the head's run check, last in slot A, so nothing moves.
    BOSS_HEAD_CHECK: load = BOSS_SLOT_RAM,  type = ro, define = yes;
    BOSS_INSTALL:  load = BOSS_INSTALL_RAM, type = ro, define = yes;
    BOSS_C_CODE:   load = BOSS_SLOT_C_RAM,  type = ro, define = yes;
    BOSS_C_RODATA: load = BOSS_SLOT_C_RAM,  type = ro, define = yes, optional = yes;
    BOSS_C_ASM:    load = BOSS_SLOT_C_RAM,  type = ro, define = yes, optional = yes;
    BOSS_C_BSS:    load = BOSS_SLOT_C_RAM,  type = bss, define = yes;
    BOSS_SCRATCH:  load = BOSS_SCRATCH_RAM, type = bss, define = yes;
    BOSS_BSS:      load = BOSS_SCRATCH_RAM, type = bss, define = yes;
    # S5-1 (owner decision Q8): the HUD booster cells' backup, the scratch
    # page's last ten bytes - written by the window's entry half before slot
    # A is read, so it must stay where both links expect it.
    BOSS_HUD_BACKUP: load = BOSS_SCRATCH_RAM, type = bss, define = yes, start = $18F6;
    BOSS_D_CODE:   load = BOSS_SLOT_D_RAM,  type = ro, define = yes;
    BOSS_D_BSS:    load = BOSS_SLOT_D_RAM,  type = bss, define = yes;
    BOSS_E_CODE:   load = BOSS_SLOT_E_RAM,  type = ro, define = yes;
    BOSS_E_BSS:    load = BOSS_SLOT_E_RAM,  type = bss, define = yes, optional = yes;
}
