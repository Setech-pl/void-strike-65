MEMORY {
  DIRECTOR_ABI_RAM: start = $8701, size = $0076, type = ro, file = %O, define = yes;
  HYBRID_C_STATE_RAM: start = $8110, size = $0009, type = rw, file = "", define = yes;
  HYBRID_LIGHT_STATE_RAM: start = $8100, size = $0010, type = rw, file = "", define = yes;
  HYBRID_ENCOUNTER_STATE_RAM: start = $8119, size = $0002, type = rw, file = "", define = yes;
  HYBRID_HEAVY_STATE_RAM: start = $811B, size = $000B, type = rw, file = "", define = yes;
  DIRECTOR_C_LOW_RAM: start = $8B88, size = $00F8, type = ro, file = %O, define = yes;
  HYBRID_C_EXT_RAM: start = $8C7D, size = $0383, type = ro, file = %O, define = yes;
  DIRECTOR_C_PRE_RAM: start = $9D5E, size = $0017, type = ro, file = %O, define = yes;
  DIRECTOR_RAM: start = $9D75, size = $0285, type = ro, file = %O, define = yes;
  HYBRID_C_SECTOR_RAM: start = $8602, size = $00F8, type = ro, file = %O, define = yes;
  # Roadmap 4.5M-M3: one contiguous 832-B direct-landing arena $7BD0-$7F0F for
  # cc65 code, cc65 read-only data and assigned ca65 helpers (replaces the
  # 243-B HYBRID_C_HEAVY window). Its own DFMC record lands it in place.
  HYBRID_C_ARENA_RAM: start = $7BD0, size = $0340, type = ro, file = %O, define = yes;
  DIRECTOR_BSS: start = $80F4, size = $000C, type = rw, file = "", define = yes;
  DIRECTOR_C_RAM: start = $86FA, size = $0007, type = rw, file = "", define = yes;
  DIRECTOR_GUARD: start = $9FFA, size = $0006, type = ro, file = "", define = yes;
  # Owner decision B (2026-09-20): the RAM under the BASIC ROM. disable_basic_rom
  # forces PORTB bit 1 and writes BASICF at every stage-2 entry, so $A000-$BFFF
  # is unconditionally RAM for the whole runtime. With BASIC off at coldstart
  # the OS sets RAMTOP $C0 and puts its screen at $BC20-$BFFF, so the usable
  # window is $A000-$BC1F = 7,200 B, not 8,192. The top six bytes are reserved
  # in the same shape as the $9FFA Director guard: no segment loads there, so
  # an overrun is a link error and not a runtime surprise.
  BASIC_WINDOW_RAM: start = $A000, size = $1C1A, type = ro, file = %O, define = yes;
  BASIC_WINDOW_GUARD: start = $BC1A, size = $0006, type = ro, file = "", define = yes;
}

SEGMENTS {
  DIRECTOR_ABI:    load = DIRECTOR_ABI_RAM, type = ro, define = yes;
  HYBRID_C_STATE:  load = HYBRID_C_STATE_RAM, type = bss, define = yes;
  HYBRID_LIGHT_STATE: load = HYBRID_LIGHT_STATE_RAM, type = bss, define = yes;
  HYBRID_ENCOUNTER_STATE: load = HYBRID_ENCOUNTER_STATE_RAM, type = bss, define = yes;
  HYBRID_HEAVY_STATE: load = HYBRID_HEAVY_STATE_RAM, type = bss, define = yes;
  DIRECTOR_C_LOW:  load = DIRECTOR_C_LOW_RAM, type = ro, define = yes;
  ENEMY_ARCHETYPE_DATA: load = HYBRID_C_EXT_RAM, type = ro, define = yes;
  HYBRID_C_EXT:    load = HYBRID_C_EXT_RAM, type = ro, define = yes;
  DIRECTOR_C_PRE:  load = DIRECTOR_C_PRE_RAM, type = ro, define = yes;
  LEVEL1_DATA:     load = DIRECTOR_RAM, type = ro, define = yes;
  DIRECTOR_C_CODE: load = DIRECTOR_RAM, type = ro, define = yes;
  HYBRID_C_SECTOR: load = HYBRID_C_SECTOR_RAM, type = ro, define = yes;
  HYBRID_ASM_ARENA: load = HYBRID_C_ARENA_RAM, type = ro, define = yes;
  HYBRID_C_ARENA:  load = HYBRID_C_ARENA_RAM, type = ro, define = yes;
  HYBRID_C_ARENA_RODATA: load = HYBRID_C_ARENA_RAM, type = ro, define = yes;
  DIRECTOR_C_BSS:  load = DIRECTOR_C_RAM, type = bss, define = yes;
  BASIC_WINDOW:    load = BASIC_WINDOW_RAM, type = ro, define = yes;
}
