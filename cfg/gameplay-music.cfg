# Music v2 §1.4 placement G1 (owner answer Q-P1 ACCEPTED, 2026-09-22). The
# gameplay music player links on its own, after main, and its bytes are
# spliced into the per-level image directly behind the reader's eight-byte
# header. At runtime the image lives in LEVEL_BUFFER, so the block executes
# from $A608 — an XEX block on the XEX, a direct-SIO read at START GAME on
# the ATR.
#
# $A600-$A607  level header (sector_reader_validate)
# $A608-$A87F  this block: three entry vectors, player code, score data
#              (sectors 1-5 of the image; header byte 7 records that LevelDef
#              starts at sector 6)
# $A880-...    LevelDef and per-level art (roadmap 4.6)
#
# GAMEPLAY_MUSIC_RAM's start and size are REWRITTEN by scripts/build.mjs from
# the same constants that lay out the level image, so the reservation and the
# splice can never disagree. The literals below are only a placeholder so the
# file is a valid config on its own; src/hybrid/gameplay-music.s asserts at
# link time that the start and the end really are the generated pair.

MEMORY {
    GAMEPLAY_MUSIC_RAM: start = $A608, size = $0278, type = ro, file = %O, define = yes;
}

SEGMENTS {
    GAMEPLAY_MUSIC: load = GAMEPLAY_MUSIC_RAM, type = ro, define = yes;
}
