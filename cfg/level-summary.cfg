# M5a-S2 (docs/plans/m5-loading-boss.md §4.8.1): the level-summary module. Its
# own link, read from the disk by the sector reader (overlay directory entry
# 8) once per session and resident from then on. Never part of the boot
# transport.
#
# $0500-$06FF is the boot splash's RAM, free once the splash hold ends; the
# module grew past it (MEASURED 1,359 B + the write path against the plan's
# 480-B estimate), so the owner gave it $0700-$0BFF as well (decision
# 2026-10-03): RAM no link claims, MEASURED in Atari800 never written after
# `start` (docs/diagnostics/low-ram-0700-1fff-2026-10-03.md). The region is
# CLAIMED here: nothing else may link into $0500-$0BFF, and
# tests/level-summary-build.test.mjs fails if any link or the boot path does.
# $0C00-$1FFF stays unclaimed: an owner-recorded lever, not used now.

MEMORY {
    LEVEL_SUMMARY_RAM: start = $0500, size = $0700, type = rw, file = %O, define = yes;
}

SEGMENTS {
    LEVEL_SUMMARY: load = LEVEL_SUMMARY_RAM, type = rw, define = yes;
}
