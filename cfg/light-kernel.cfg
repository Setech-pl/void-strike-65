# L1: the complete Light composite is a separate LZ DFMC record, held packed
# at $0C00 during boot and published to MAIN after loader-bitmap unpack.
# scripts/build.mjs rewrites the memory area to $3643-$3AFF (1,213 B).
# src/hybrid/light-kernel.s asserts that exact base and the $3B00 PMG bound.
# The placeholder below describes the same reviewed MAIN reservation.

MEMORY {
    LIGHT_KERNEL_RAM: start = $3643, size = $04BD, type = ro, file = %O, define = yes;
}

SEGMENTS {
    LIGHT_KERNEL: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
    # audit-hardening (docs/plans/audit-hardening.md §3): the disk guard, last,
    # so the kernel keeps its address and the guard's bytes ride its record.
    DISK_GUARD: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
    # audit-hardening: the capital vector table's boot image, moved from the
    # reader (src/hybrid/light-kernel.s).
    CAPITAL_VECTOR_IMAGE: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
    # S5-1 (owner decision Q8): the boss entry's HUD booster backup, last, so
    # nothing in the window moves (src/hybrid/light-kernel.s).
    HUD_BOOSTER_BACKUP: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
    LIFE_CAPSULE: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
    PAUSE_FRONTEND: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
}
