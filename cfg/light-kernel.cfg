# Light multiplicity step 1b (plan-light-multiplicity.md §3.1 [C1], owner
# decision 2026-09-21). The Light ASM kernel links on its own, after main, and
# is transported as a raw DFMC record whose final destination is the code
# window above the Director link's C half.
#
# LIGHT_KERNEL_RAM's start and size are REWRITTEN by scripts/build.mjs from
# HYBRID_ASM_WINDOW_BASE - the address after the last byte the Director link's
# window half actually used in this build. The literals below are only a
# placeholder so the file is a valid config on its own; src/hybrid/light-kernel.s
# asserts at link time that the start really is HYBRID_ASM_WINDOW_BASE and that
# the end stays below the sector reader's BSS at $BC00. The placeholder tracks
# the window's base so the file reads true: $AE00 since Q-1 (owner, 2026-09-23),
# $B600 under owner decision X before it.

MEMORY {
    LIGHT_KERNEL_RAM: start = $AE00, size = $0E00, type = ro, file = %O, define = yes;
}

SEGMENTS {
    LIGHT_KERNEL: load = LIGHT_KERNEL_RAM, type = ro, define = yes;
}
