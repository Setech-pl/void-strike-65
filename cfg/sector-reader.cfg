# Roadmap 4.3: the resident direct-SIO sector reader, owner decision B's
# window. The reader links on its own and is transported as a raw DFMC record
# whose final destination is $A000, the shape the arena record already uses.
#
# $A000-$A5FF  reader code, the loader-mode display driver and the AI text pool
# $A600-$ADFF  LEVEL_BUFFER, 2,048 B = 16 sectors (never in the file)
# $AE00-$BBFF  HYBRID_C_WINDOW, the Light kernel (cfg/encounter-director.cfg)
# $BC00-$BC19  reader BSS
# $BC1A-$BC1F  the six-byte window guard, reserved with no segment
#
# Owner decision X (2026-09-21): the buffer shrank from 44 to 32 sectors. It
# was sized before decision F made capital art parametric; the real per-level
# need is ~512 B of LevelDef plus ~1,253 B for one art set. The freed 1,536 B
# host the Light kernel.
#
# Q-1 (owner decision 2026-09-23, docs/plans/director-4.6.md §3.1): 32 -> 16.
# The 4.6 level image is 13 sectors at its worst - header and gameplay music 5,
# hull block 3, LevelDef core 2, payload 2, HullGeometry 1 - so 16 sectors carry
# every level with 3 spare, and the 2,048 B released go to HYBRID_C_WINDOW,
# which is where the data-driven Director's code lives.

MEMORY {
    READER_ZP_RAM:      start = $00A0, size = $0002, type = rw, define = yes;
    SECTOR_READER_RAM:  start = $A000, size = $0600, type = ro, file = %O, define = yes;
    LEVEL_BUFFER_RAM:   start = $A600, size = $0800, type = rw, file = "", define = yes;
    READER_BSS_RAM:     start = $BC00, size = $001A, type = rw, file = "", define = yes;
    READER_GUARD:       start = $BC1A, size = $0006, type = ro, file = "", define = yes;
}

SEGMENTS {
    READER_ZP:     load = READER_ZP_RAM,     type = zp,  define = yes;
    SECTOR_READER: load = SECTOR_READER_RAM, type = ro,  define = yes;
    READER_BSS:    load = READER_BSS_RAM,    type = bss, define = yes;
}
